.mini{display:flex;background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:2px}
.mini button{height:22px;padding:0 var(--sp-3);border-radius:2px;color:var(--text-tertiary);font:600 11px/14px var(--font-ui)}
.mini button[aria-pressed=true]{background:var(--surface-3);color:var(--text-primary)}
.mini button:hover{color:var(--text-primary)}
.stepper{display:flex;align-items:center;gap:var(--sp-2)}
.stepper button{width:22px;height:22px;border:1px solid var(--border-default);border-radius:var(--r-sm);
  color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font:500 13px/13px var(--font-mono)}

.stepper .v{width:22px;text-align:center;font:500 13px/16px var(--font-mono)}
.switch{position:relative;width:34px;height:18px;border-radius:9px;background:var(--surface-3);

.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:var(--text-tertiary);transition:transform var(--dur-fast) var(--ease-out),background var(--dur-fast)}
.switch[aria-pressed=true]{background:var(--accent-dim);border-color:var(--accent)}
.switch[aria-pressed=true]::after{transform:translateX(16px);background:var(--accent-hover)}
.arrows2{display:flex;flex-direction:column;gap:2px;margin-top:var(--sp-3);padding:var(--sp-3);background:var(--surface-1);
  border-radius:var(--r-md);font:400 11px/15px var(--font-ui);color:var(--text-tertiary)}
.arrows2 b{color:var(--text-secondary);font-weight:600}
.mixrow{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2)}
.mixrow label{width:56px;font:600 11px/14px var(--font-ui);color:var(--text-secondary)}
.mixrow input[type=range]{height:20px;flex:1}
.mixrow input[type=range]::-webkit-slider-thumb{width:12px;height:12px;margin-top:-4px;border-width:2px}
.mixrow input[type=range]::-webkit-slider-runnable-track{height:4px}
.mixrow .v{width:26px;text-align:right;font:500 11px/14px var(--font-mono);color:var(--text-tertiary)}
/* V2-PLAN §4 — the villain profile, the segmented Simulate bar and the honesty badges */
.vprow{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3)}
.vprow input[type=range]{height:20px;flex:1 1 auto;min-width:0}
.vprow input[type=range]::-webkit-slider-thumb{width:12px;height:12px;margin-top:-4px;border-width:2px}
.vprow input[type=range]::-webkit-slider-runnable-track{height:4px}
.vprow .v{width:34px;text-align:right;font:500 11px/14px var(--font-mono);color:var(--text-tertiary)}
.vpstat{margin-top:var(--sp-3);font:600 10px/14px var(--font-ui);letter-spacing:.06em;color:var(--text-tertiary)}
.vpstat b{color:var(--text-secondary);font-weight:700}
.simsegs{display:flex;gap:3px;margin-top:var(--sp-3)}
.simseg{position:relative;flex:1 1 0;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.simseg i{position:absolute;top:0;bottom:0;left:0;width:0;display:block;background:var(--accent)}
.simseg.skip{opacity:.3}
.simline{margin-top:var(--sp-2);font:500 10px/15px var(--font-mono);color:var(--text-tertiary)}
.simbar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-2) var(--sp-5);
  flex:0 0 auto;border-bottom:1px solid var(--border-subtle);font:400 11px/16px var(--font-ui);color:var(--text-tertiary)}
.simbadge{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:var(--r-sm);
  border:1px solid var(--border-default);background:var(--surface-2);color:var(--text-tertiary);
  font:600 10px/13px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.simbadge.interp{color:var(--s3);border-color:var(--s3)}
.simbadge.meas{color:var(--accent);border-color:var(--accent-dim)}
.rail-foot{padding:var(--sp-5) 0 var(--sp-2);color:var(--text-tertiary)}
.rail-foot .links{display:flex;gap:var(--sp-4);margin-bottom:var(--sp-3)}
.rail-foot button{color:var(--text-tertiary);font:600 11px/14px var(--font-ui);letter-spacing:.04em}
.rail-foot button:hover{color:var(--accent)}
.rail-foot .meta{font:400 10px/15px var(--font-mono);color:var(--text-tertiary)}
/* ============================================================ MATRIX PANE */
.pane{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--surface-1);
  border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden}
/* THE LEGEND BAND, RE-MEASURED (§8 item 13 puts the colour-mode switch here — the matrix owns its
   encoding). Measured on the shipped artifact at 1440x900, where the matrix pane is 736 px wide:
   the row was already at capacity before item 13 (chips 110+157+91+107, badge 145, help 18, gaps
   and padding 62 = 690 of 734, the hover slot absorbing the last 60). A 205 px mode switch and a
   481 px ramp scale do not fit in 44 px, and the two ways to pretend they do are both dishonest —
   squeezing the tier chips to 14 px destroys the FILTER, and scrolling the overflow away hides the
   ramp, the badge and the help button behind a scrollbar that is styled to nothing.
   So the band is two lines, and the split is by JOB rather than by whatever the pane width happens
   to be: the FILTER line (tier chips, hover slot, frequency badge, help) is left exactly as it was
   before item 13 — measured identical to the pre-item-13 artifact at every width — and the
   ENCODING line under it carries the mode switch and the scale of whatever mode is on. `.encline`
   is `flex:1 0 100%`, so the break is structural and cannot move with the viewport. */
.legend{display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:5px;
  min-height:40px;padding:0 var(--sp-4);flex:0 0 auto;
  background:var(--surface-2);border-bottom:1px solid var(--border-subtle)}
/* the encoding line: what the colours mean, and the scale they mean it on */
.encline{order:9;flex:1 0 100%;display:flex;align-items:center;gap:var(--sp-4);min-width:0;
  height:30px;margin-bottom:4px;border-top:1px solid var(--border-subtle);padding-top:4px}
.modesw{display:flex;flex:0 0 auto;gap:1px;padding:2px;border-radius:var(--r-sm);
  background:var(--surface-1);border:1px solid var(--border-subtle)}
.modesw button{height:22px;padding:0 var(--sp-3);border-radius:2px;color:var(--text-tertiary);
  font:600 10px/12px var(--font-ui);letter-spacing:.05em;white-space:nowrap}
.modesw button:hover{color:var(--text-primary)}
.modesw button[aria-pressed=true]{background:var(--surface-3);color:var(--text-primary)}
/* the structural-disablement idiom (`SIM.available`'s): dimmed and carrying the reason */
.modesw button[aria-disabled=true]{color:var(--text-disabled);cursor:default}
.modesw button[aria-disabled=true]:hover{color:var(--text-disabled)}
.chip{display:flex;align-items:center;gap:var(--sp-3);height:28px;padding:0 var(--sp-3);
  border-radius:var(--r-sm);border:1px solid transparent;color:var(--text-secondary);
  font:600 11px/14px var(--font-ui);letter-spacing:.04em;white-space:nowrap;min-width:0;overflow:hidden;
  transition:background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast)}
.chip .sw{width:14px;height:14px;border-radius:2px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font:700 8px/8px var(--font-ui)}
.chip .pc{color:var(--text-tertiary);font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
.chip:hover{background:rgba(255,255,255,.05);color:var(--text-primary)}
.chip[aria-pressed=true]{border-color:var(--text-primary);background:rgba(255,255,255,.07)}
/* the hover readout yields width to the honesty badge, which must never clip */
.hoverslot{margin-left:auto;flex:1 1 0;min-width:0;max-width:230px;text-align:right;font:500 13px/18px var(--font-mono);
  color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbadge{display:flex;align-items:center;gap:var(--sp-3);min-height:22px;padding:2px var(--sp-2);border-radius:var(--r-sm);
  border:1px solid var(--border-default);color:var(--text-tertiary);font:600 9px/11px var(--font-ui);letter-spacing:.04em;flex:0 0 auto}
/* the qualifier is the honesty claim and is never dropped; it stacks under the
   mode name so the badge fits the 1440 legend row without clipping. */
.hbadge .txt{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.hbadge .qual{color:var(--text-tertiary);font-weight:500;font-size:9px;letter-spacing:.03em}
.hbadge .dot{width:6px;height:6px;border-radius:50%;background:var(--pos-warn)}
.hbadge:hover{border-color:var(--border-strong);color:var(--text-secondary)}
.hbadge.true .dot{background:var(--info)}
/* the scale shares the encoding line with the switch and yields to it: `min-width:0` plus an
   ellipsis on the caption, so a narrow pane loses the tail of a sentence, never a swatch. */
.ramp{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:var(--sp-3);height:26px}
.ramp .steps{display:flex;flex:0 0 auto;height:12px;border-radius:2px;overflow:hidden}
.ramp .steps i{width:22px;height:12px;position:relative}
.ramp .end{flex:0 0 auto;color:var(--text-tertiary);font:500 9px/11px var(--font-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.ramp .mid{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  color:var(--text-tertiary);font:600 9px/11px var(--font-ui);letter-spacing:.04em;white-space:nowrap}
/* the ramp swatches carry the cells' hatches, so the legend reads in the same channel */
.hatch .ramp .steps i::after{content:"";position:absolute;inset:0;opacity:.42}
/* composition ribbon */
.comp{display:flex;align-items:center;gap:var(--sp-4);height:28px;padding:0 var(--sp-5);flex:0 0 auto;background:var(--surface-1)}
.compbar{flex:1 1 auto;display:flex;height:16px;gap:2px;border-radius:2px;overflow:hidden;min-width:0}
.compbar i{display:flex;align-items:center;justify-content:center;font:600 9px/16px var(--font-ui);overflow:hidden;
  transition:width var(--dur-morph) var(--ease-standard)}
.compnu{flex:0 0 auto;font:500 12px/16px var(--font-mono);color:var(--text-secondary);font-variant-numeric:tabular-nums}
.subtitle{display:none}
.chgut{padding-bottom:var(--sp-3);font:500 10px/13px var(--font-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the search hit. An outline, not a box-shadow: aria-selected already owns the inset ring, and a
   cell can be both the selection and the hit at once. */
.cell.sfind{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
.cell.void.sfind{outline-color:var(--pos-bad)}
.rowh.sfind{background:rgba(255,255,255,.06);box-shadow:inset 2px 0 0 var(--accent)}
/* column header */
.colhead{display:grid;grid-template-columns:var(--gut) var(--c1) var(--c2) var(--c3) var(--c4) var(--c5);
  column-gap:2px;padding:0 var(--sp-5);height:30px;align-items:end;flex:0 0 auto;border-bottom:1px solid var(--border-subtle)}
.colhead .ch{padding-bottom:var(--sp-2);text-align:center;overflow:hidden}
.colhead .ch button:not(.q){width:100%;color:var(--text-tertiary);font:600 9px/12px var(--font-ui);letter-spacing:.07em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.colhead .ch button:not(.q):hover{color:var(--text-primary)}
.colhead .chsub{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0}
.colhead .ch .sh{display:block;font:500 10px/13px var(--font-mono);color:var(--text-tertiary);font-variant-numeric:tabular-nums;cursor:pointer}
.colhead .ch .sh:hover{color:var(--text-primary)}
.colhead .ch[data-solo=true] button:not(.q),.colhead .ch[data-solo=true] .sh{color:var(--accent)}
/* grid */
.gridwrap{position:relative;flex:1 1 auto;overflow:auto;padding:var(--sp-2) var(--sp-5) var(--sp-8)}
.band{position:relative;margin-bottom:4px}
.band:last-child{margin-bottom:0}
.band .spine{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border-strong);border-radius:2px;cursor:pointer}
.band .spine:hover{background:var(--accent-dim)}
.band .bname{position:absolute;left:5px;top:0;bottom:0;width:11px;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;transform:rotate(180deg);color:var(--text-tertiary);font:600 9px/11px var(--font-ui);
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;pointer-events:none}
.row{display:grid;grid-template-columns:var(--gut) var(--c1) var(--c2) var(--c3) var(--c4) var(--c5);column-gap:2px;margin-bottom:1px}
.row:last-child{margin-bottom:0}
.rowh{display:flex;align-items:center;gap:var(--sp-2);padding-left:17px;height:var(--cell-h);overflow:hidden;cursor:pointer}
.rowh .nm{flex:1 1 auto;font:400 11px/14px var(--font-ui);color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowh:hover .nm{color:var(--text-primary)}
.rowh .fb{flex:0 0 22px;height:6px;background:var(--surface-2);border-radius:1px;overflow:hidden}
.rowh .fb i{display:block;height:100%;background:var(--border-strong)}
.rowh[data-solo=true] .nm{color:var(--accent)}
.cell{position:relative;height:var(--cell-h);border-radius:var(--r-cell);background:var(--t5);
  box-shadow:inset 0 0 0 1px var(--t5-ring);cursor:pointer;overflow:hidden;
  transition:background-color var(--dur-morph) var(--ease-standard);transition-delay:var(--wd,0ms)}
.matrix.is-dragging .cell{transition:none!important;transition-delay:0ms!important}
.cell .g{position:absolute;top:1px;right:2px;font:700 8px/8px var(--font-ui);opacity:.85;pointer-events:none}
.cell .pips{position:absolute;left:2px;bottom:2px;display:flex;gap:1px;pointer-events:none}
.cell .pips i{width:3px;height:3px;border-radius:.5px}
.cell .cs{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font:500 10px/10px var(--font-mono);opacity:.62;pointer-events:none;font-variant-numeric:tabular-nums}
.comfort .cell .cs{display:flex}
.cell .chev{position:absolute;right:2px;top:50%;transform:translateY(-50%);font:700 9px/9px var(--font-ui);
  color:var(--text-primary);text-shadow:0 0 3px var(--bg-void);pointer-events:none}
.cell .notable{position:absolute;right:2px;bottom:2px;width:3px;height:3px;border-radius:50%;background:var(--accent-dim)}
.cell.t1{background:var(--t1);box-shadow:inset 0 0 0 1px var(--t1-ring);color:var(--t1-ink)}
.cell.t2{background:var(--t2);box-shadow:inset 0 0 0 1px var(--t2-ring);color:var(--t2-ink)}
.cell.t3{background:var(--t3);box-shadow:inset 0 0 0 1px var(--t3-ring);color:var(--t3-ink)}
.cell.t4{background:var(--t4);box-shadow:inset 0 0 0 1px var(--t4-ring);color:var(--t4-ink)}
.cell.t5{background:var(--t5);box-shadow:inset 0 0 0 1px var(--t5-ring);color:var(--t5-ink)}
.cell.t1:hover{background:var(--t1-hover)} .cell.t2:hover{background:var(--t2-hover)}
.cell.t3:hover{background:var(--t3-hover)} .cell.t4:hover{background:var(--t4-hover)} .cell.t5:hover{background:var(--t5-hover)}
.cell:hover{box-shadow:inset 0 0 0 1px rgba(239,245,246,.6)}
.cell[aria-selected=true]{box-shadow:inset 0 0 0 2px var(--bg-void),inset 0 0 0 3px var(--text-primary);z-index:2}
.cell.void{background:var(--bg-void);box-shadow:none;cursor:default;
  background-image:linear-gradient(45deg,transparent calc(50% - .5px),var(--border-subtle) 50%,transparent calc(50% + .5px))}
.cell.ghost{opacity:.30;filter:saturate(.35)}
.cell.pulse{animation:pulse .3s var(--ease-out) 2}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 1px var(--t5-ring)}50%{box-shadow:inset 0 0 0 3px var(--focus-ring)}}
.cell .fold{position:absolute;left:0;top:0;width:0;height:0;border-left:10px solid var(--accent-dim);border-bottom:10px solid transparent}
.cell .haz{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,var(--pos-bad) 0 1px,transparent 1px 5px)}
/* hatch redundancy */
/* Non-colour redundancy: below 22px rows the corner glyph cannot be read, so the hatch takes
   over automatically — the channel swaps, it never disappears. */
.hatch .cell.t2::after,.hatch .cell.t3::after,.hatch .cell.t4::after,.hatch .cell.t5::after,
.tiny .cell.t2::after,.tiny .cell.t3::after,.tiny .cell.t4::after,.tiny .cell.t5::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.30}
.tiny .cell.t2::after,.tiny .cell.t3::after,.tiny .cell.t4::after,.tiny .cell.t5::after{opacity:.22}
.hatch .cell.t2::after,.tiny .cell.t2::after{background:repeating-linear-gradient(45deg,var(--t2-ink) 0 1px,transparent 1px 4px)}
.hatch .cell.t3::after,.tiny .cell.t3::after{background:repeating-linear-gradient(-45deg,var(--t3-ink) 0 1px,transparent 1px 4px)}
.hatch .cell.t4::after,.tiny .cell.t4::after{background:repeating-linear-gradient(90deg,var(--t4-ink) 0 1px,transparent 1px 4px)}
.hatch .cell.t5::after,.tiny .cell.t5::after{background:radial-gradient(var(--t5-ink) .5px,transparent .6px) 0 0/3px 3px}
/* RAMP-STEP REDUNDANCY (§8 item 13). The hatches above are keyed to `.tN`, which the ramp modes
   do not emit — so ν/ρ/Δ-pin had no non-colour channel at all. `.k0`..`.k6` are the ramp bucket,
   under the same two switches: the user's toggle (.hatch) and the automatic one below 22 px rows
   (.tiny). `.k0` is bare on purpose — "no pattern" is a state, pinned to the dark end. */
.hatch .cell.k1::after,.hatch .cell.k2::after,.hatch .cell.k3::after,.hatch .cell.k4::after,
.hatch .cell.k5::after,.hatch .cell.k6::after,
.tiny .cell.k1::after,.tiny .cell.k2::after,.tiny .cell.k3::after,.tiny .cell.k4::after,
.tiny .cell.k5::after,.tiny .cell.k6::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.34}
.tiny .cell.k1::after,.tiny .cell.k2::after,.tiny .cell.k3::after,.tiny .cell.k4::after,
.tiny .cell.k5::after,.tiny .cell.k6::after{opacity:.26}
.k1::after{background:repeating-linear-gradient(45deg,var(--ramp-ink) 0 1px,transparent 1px 5px)}
.k2::after{background:repeating-linear-gradient(-45deg,var(--ramp-ink) 0 1px,transparent 1px 5px)}
.k3::after{background:repeating-linear-gradient(90deg,var(--ramp-ink) 0 1px,transparent 1px 4px)}
.k4::after{background:repeating-linear-gradient(0deg,var(--ramp-ink) 0 1px,transparent 1px 4px)}
.k5::after{background:repeating-linear-gradient(45deg,var(--ramp-ink) 0 1px,transparent 1px 4px),repeating-linear-gradient(-45deg,var(--ramp-ink) 0 1px,transparent 1px 4px)}
.k6::after{background:radial-gradient(var(--ramp-ink) .6px,transparent .7px) 0 0/3px 3px}
.tiny .cell .g{display:none}
#rain{position:absolute;pointer-events:none;z-index:3}
.rainhud{position:absolute;right:var(--sp-5);bottom:var(--sp-3);display:flex;align-items:center;gap:var(--sp-3);
  padding:2px var(--sp-3);background:rgba(6,14,15,.72);border:1px solid var(--border-subtle);border-radius:var(--r-sm);
  font:500 10px/14px var(--font-mono);color:var(--text-tertiary);z-index:4;font-variant-numeric:tabular-nums}

  background:rgba(12,23,24,.86);color:var(--text-tertiary);z-index:5;text-align:center;padding:var(--sp-8)}
/* vs3bet extras */
.gainstrip{display:flex;align-items:center;gap:var(--sp-3);height:26px;padding:0 var(--sp-4);flex:0 0 auto;overflow-x:auto;overflow-y:hidden;
  border-bottom:1px solid var(--border-subtle);

.gainstrip .lbl{font:600 9px/12px var(--font-ui);letter-spacing:.08em;color:var(--text-tertiary);flex:0 0 auto}
.gainstrip .mchip{display:flex;align-items:center;gap:4px;height:20px;padding:0 var(--sp-3);border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--border-subtle);font:500 10px/13px var(--font-mono);
  color:var(--text-secondary);white-space:nowrap;flex:0 0 auto}
.gainstrip .mchip:hover{border-color:var(--border-strong);color:var(--text-primary)}
.potodds{position:relative;height:34px;margin:0 var(--sp-4) 0;flex:0 0 auto;background:var(--surface-2);
  border-radius:var(--r-sm);overflow:hidden}
.potodds .be{position:absolute;top:13px;bottom:0;width:1px;background:var(--accent)}
.potodds .be b{position:absolute;left:0;top:-12px;white-space:nowrap;font:600 9px/12px var(--font-ui);
  letter-spacing:.06em;color:var(--accent)}
.potodds i{position:absolute;top:14px;height:7px;width:1px;background:var(--text-tertiary);opacity:.55}

.mobilebar,#pickbtn{display:none}
/* THE TOPBAR BAND, RE-MEASURED (S-E's one red, V3-PLAN §1 / §9 — "smoke reports 11/12 until §8
   fixes the 1280–1442 px topbar clipping").
   S-E measured the intrinsic row at 1443 px against a 1279 px breakpoint, so at every width in
   1280–1442 the Drill, Guide, Settings and Info buttons sat outside the viewport, clipped away by
   `body{overflow-x:hidden}` — invisible and unclickable, identical to the pixel in three engines.
   Two changes, both measured in headless Chromium on the shipped artifact (P1-U):
     1. `.topbar` gets `flex-wrap:wrap` + `min-height` instead of a fixed `height`, so the row can
        never clip: past its intrinsic width it WRAPS. That is the floor, and it holds at every
        width — 1024 px included, where the old rule's `flex-wrap:wrap` used to be the only thing
        standing between the page and the same defect one breakpoint lower.
     2. these trims move to 1559 px, from the measurement: the UNTRIMMED row needs 1546 px, the
        TRIMMED row needs 1394 px. 1439 was the wrong edge — it left 1440–1545 untrimmed and
        wrapping, which is 1440 itself, the width the page is drawn for. Below 1394 the bar wraps
        to two rows and stays entirely reachable, which is the honest failure mode.
   The 13 px between the measured 1546 and the 1559 breakpoint is margin for cross-engine metric
   drift; spending it costs a trimmed row at widths that could have held an untrimmed one, and not
   spending it costs a wrapped row at 1440. */
@media (max-width:1559px){
  .topbar{padding:var(--sp-3) var(--sp-6)}
  .topbar .spacer{display:none}
  .tabs,.tabs button{height:40px}
  .seg button{min-width:44px;height:32px}

  .handinput label{display:none}
  .handinput input{width:152px}
}
@media (max-width:1439px){
  #app{max-width:none}
  .shell{padding:var(--sp-6) var(--sp-6)}
  :root{--rail-w:220px}
  .inspector{position:fixed;top:0;right:0;bottom:0;width:380px;z-index:60;border-radius:0;
    border-left:1px solid var(--border-default);box-shadow:var(--e4);
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-out)}
  .inspector.open{transform:none}
  .drawer-scrim{position:fixed;inset:0;background:rgba(6,14,15,.45);z-index:59}
}
/* THE PINNED/SCROLL SPLIT, RE-MEASURED (V3-PLAN §8 item 12's last clause).
   Measured on the shipped artifact in headless Chromium at 1440 px wide, every section open:

     viewport 900   rail 780 = pin 278 + scroll 436 + foot 66   scroll content 1461 (1025 below the fold)
     viewport 800   rail 680 = pin 278 + scroll 336 + foot 66   scroll content 1461
     viewport 760   rail 640 = pin 278 + scroll 296 + foot 66   scroll content 1461
     viewport 700   rail 580 = pin 278 + scroll 236 + foot 66   scroll content 1461
     viewport 620   rail 500 = pin 278 + scroll 156 + foot 66   scroll content 1461   <- arithmetic;
     viewport 560   rail 440 = pin 278 + scroll  96 + foot 66   scroll content 1461      the rule
                                                                                         below fires
                                                                                         first

   Per section, at 900: vpip 174, ribbon 104, table 589, villain 363, thesis 119, pin 167,
   display 211 (lab and node hidden at this state) — `tablesec` alone is 40% of the scroll side.

   Two facts fall out. The first is the ANSWER to the split question: the pinned block is 278 px
   and holds exactly the two things the page is about — the VPIP hero and the tier ribbon — while
   the 1461 px behind it is the settings. Nothing wants to move across; what the split needed was
   a way to make the scroll side SMALLER, and item 12 is that way. Collapsed, the whole rail
   measures 636 px of content in a 636 px box: NOTHING below the fold, and the pinned block itself
   down to 78 px. The split was not mis-drawn, it was over-subscribed.
   The second is a hazard the collapse does not remove on its own: `.rail-pin` is `flex:0 0 auto`,
   so on a short viewport it keeps all 278 px and the scroll region is squeezed to a slit — 156 px
   at 620 px tall, 96 at 560, still holding 1461 px of sections, and a user who has not collapsed
   anything yet has to find the toggles inside it. Below 700 px of viewport the split has stopped
   earning its keep, so it is dropped: the rail scrolls as one column, which is strictly more
   reachable than a 96 px window, and the collapse state is untouched by the change. */
@media (max-height:699px) and (min-width:1024px){
  .rail{overflow-y:auto;overflow-x:hidden}
  .rail-scroll{flex:0 0 auto;overflow:visible;-webkit-mask-image:none;mask-image:none}
  /* the provenance line keeps the promise its markup makes — "must never be the thing that gets
     sliced when the rail overflows" — by sticking to the bottom of the column that now scrolls */
  .rail-foot{position:sticky;bottom:0;background:var(--bg-base);
    border-top:1px solid var(--border-subtle);padding-top:var(--sp-3)}
}
@media (max-width:1023px){
  .rail{width:100%;flex:0 0 auto}
  .shell{flex-direction:column;padding:var(--sp-5)}
  .rail-scroll{max-height:none;overflow:visible;-webkit-mask-image:none;mask-image:none}
  .topbar{gap:var(--sp-4);padding:0 var(--sp-5)}
}
@media (max-width:767px){
  body{font-size:16px;line-height:24px}
  .topbar{height:52px;padding:0 var(--sp-4);padding-top:env(safe-area-inset-top)}
  .topbar .seg,.topbar .tabs,.topbar .handinput,.topbar .viewsw{display:none}
  #pickbtn{display:inline-flex}
  .shell{padding:0;gap:0}
  .mobilebar{display:block;position:sticky;top:0;z-index:30;background:var(--bg-base);
    border-bottom:1px solid var(--border-subtle);padding:var(--sp-3) var(--sp-4)}
  .mobilebar .selects{display:flex;gap:var(--sp-3);margin-bottom:var(--sp-2)}
  .mobilebar select{flex:1 1 0;height:44px;background:var(--surface-1);border:1px solid var(--border-default);
    border-radius:var(--r-md);padding:0 var(--sp-4);color:var(--text-primary);font:600 14px/18px var(--font-ui)}
  .mobilebar .sl{display:flex;align-items:center;gap:var(--sp-4)}
  .mobilebar .sl input{flex:1 1 auto;height:44px}
  .mobilebar .sl .v{font:500 16px/20px var(--font-mono);width:40px;text-align:right;font-variant-numeric:tabular-nums}
  .honesty{display:none}
  .rail,.inspector{display:none}
  .pane{border:none;border-radius:0;background:transparent}
  /* height:auto, not 48: the band is two lines now (filter, then encoding) and a fixed height
     would clip the second one away — the mode switch — with no cue that it was there. */
  .legend{overflow-x:auto;background:transparent;height:auto;min-height:48px}
  .encline{height:auto;min-height:44px;flex-wrap:wrap;row-gap:var(--sp-2)}
  /* the sheet is not the 1024 drawer, and carries the heavier scrim */
  .drawer-scrim{background:var(--scrim)}
  /* the row scrolls, so chips must not shrink away their percentages */
  .legend .chip{flex:0 0 auto;overflow:visible;min-width:auto}
  .hoverslot,.hbadge{display:none}
  /* touch targets: everything tappable is >= 44px at 390 (AC-21) */
  .topbar .btn{height:44px}
  .btn-icon{width:44px}
  .legend .chip{height:44px}
  .gridwrap{padding:var(--sp-3) var(--sp-4) 90px}
  :root{--gut:92px;--cell-h:44px}
  .row,.colhead{grid-template-columns:var(--gut) repeat(5,minmax(0,1fr))}
  .mosaic .row,.mosaic .colhead{grid-template-columns:var(--gut) 56fr 93fr 262fr 48fr 71fr}
  .cell .cs{display:none!important}
  .rowh{padding-left:13px;gap:var(--sp-2)}
  .rowh .nm{font-size:11px;line-height:13px}
  .rowh .fb{flex:0 0 14px}
  .colhead .ch button:not(.q){font-size:8px;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px}
  /* the label button + share line stack; together they keep the 44px tap column (AC-21) */
  .colhead .ch{min-height:44px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end}
  .colhead{align-items:end}
  .inspector{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:85vh;
    max-height:calc(100vh - var(--sheet-top,200px));border-radius:var(--r-xl) var(--r-xl) 0 0;
    transform:translateY(100%);border:1px solid var(--border-default);padding-bottom:env(safe-area-inset-bottom)}
  .inspector.open::before{opacity:1}
  .inspector.open .itabs{padding-top:10px}
  .inspector.open{display:flex;transform:none}
  #drill{inset:0;border-radius:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;
    transition-duration:1ms!important;transition-delay:0ms!important}
}
.reduce *,.reduce *::before,.reduce *::after{animation-duration:1ms!important;transition-duration:1ms!important;transition-delay:0ms!important}
</style>

<body>
<noscript>
  <div style="padding:32px;max-width:640px;font-family:system-ui,sans-serif;color:#B5C0C2">
    <h1 style="font-size:22px;color:#EFF5F6">RUNDOWN</h1>
    <p style="margin-top:12px">Heuristic model — equity &times; nut-playability, calibrated by Monte Carlo. Not a solver.</p>
    <p style="margin-top:12px">This tool requires JavaScript; it runs entirely offline once loaded.</p>
  </div>
</noscript>

<div id="app">
  <!-- ============================== TOPBAR -->
  <header class="topbar">
    <div class="wordmark" aria-label="RUNDOWN">RUN<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 2v10M3.5 8.5 7 12l3.5-3.5"/></svg>DOWN</div>
    <div class="seg" id="posseg" role="group" aria-label="Position"><div class="thumb" id="posthumb"></div></div>
    <nav class="tabs" id="facingtabs" role="tablist" aria-label="Facing action"></nav>
    <div class="spacer"></div>
    <div class="handinput" id="handinput">
      <!-- THE finder — one box, both questions, one grammar (TAXONOMY.parseHandQuery). Four
           SPECIFIC cards name a hand and open the inspector on it; four RANKS plus an optional
           suit code name a class and move the grid to it. The grid used to carry a second box for
           the second half of that; it does not any more, and there is nothing left to confuse. -->
      <label for="handq">FIND HAND</label>
      <input id="handq" type="text" spellcheck="false" autocomplete="off" maxlength="24"
        placeholder="AsKh9s8d or 9655DS" aria-describedby="handmsg"
        aria-label="Find a hand — four specific cards with suits, or four ranks plus an optional suit code">
      <button class="btn btn-icon" id="handqx" aria-label="Clear the hand finder" title="Clear (Esc)">&#10005;</button>
      <div class="msg" id="handmsg" hidden></div>
    </div>
    <div class="viewsw" id="viewsw" role="group" aria-label="View"></div>
    <button class="btn btn-accent" id="drillbtn" title="Drill (D)">DRILL</button>
    <button class="btn btn-icon" id="pickbtn" aria-label="Find a hand" title="Find a hand">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.2" y="3.2" width="7" height="9.6" rx="1.4"/><path d="M6.6 2.4h5.6a1.4 1.4 0 0 1 1.4 1.4v7.4"/></svg></button>
    <button class="btn btn-icon" id="guidebtn" aria-label="How to read this" title="How to read this (G)">?</button>
    <button class="btn btn-icon" id="setbtn" aria-label="Settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg></button>
    <button class="btn btn-icon" id="infobtn" aria-label="Model honesty statement" title="Model honesty statement">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4M8 4.6v.9"/></svg></button>
  </header>

  <!-- ============================== HONESTY STRIP -->
  <div class="honesty" id="honestystrip">
    <span class="txt">Heuristic model — equity &times; nut-playability, calibrated by Monte Carlo. <b style="color:var(--text-primary)">Not a solver.</b></span>
    <a href="#method" id="methodlink">Method &#9656;</a>
    <div class="spacer"></div>
    <button class="btn btn-icon" id="honestyx" aria-label="Collapse honesty strip" style="height:22px;width:22px;border:none">&#10005;</button>
  </div>

  <!-- ============================== SHELL -->
  <main class="shell">
    <!-- RAIL -->
    <aside class="rail" id="rail" aria-label="Controls">
      <div class="rail-pin">
        <section class="rsec" id="vpipsec">
          <div class="rsec-h"><button class="rsec-t" type="button" aria-controls="vpipsec-b"><span class="chev" aria-hidden="true"></span><span class="t-label">Table VPIP</span><span class="rsec-v t-micro" id="vpiptag">SOFT</span></button></div>
          <div class="rsec-b" id="vpipsec-b">
          <div class="vpip-top">
            <div class="vpip-val" id="vpipval">55<span class="pct">%</span></div>
            <input class="vpip-num" id="vpipnum" type="number" inputmode="numeric" min="25" max="90" step="1" value="55" aria-label="Table VPIP percent">
          </div>
          <div class="slider-wrap"><input id="vpip" type="range" min="25" max="90" step="1" value="55" aria-label="Table VPIP"></div>
          <div class="ticks" id="ticks"></div>
          <div class="derived" id="derived"></div>
          </div>
        </section>
        <section class="rsec" id="ribbonsec">
          <div class="rsec-h"><button class="rsec-t" type="button" aria-controls="ribbonsec-b"><span class="chev" aria-hidden="true"></span><span class="t-label">Tier ribbon</span><span class="rsec-v t-micro" id="ribbonwho">&mdash;</span></button></div>
          <div class="rsec-b" id="ribbonsec-b">
          <div class="ribbon" id="railribbon" role="img"><div class="caret" id="railcaret"></div></div>
          <div class="ribbon-labels" id="railribbonlabels"></div>
          <div class="ribbon-cap" id="railribboncap"></div>
          </div>
        </section>
        <!-- vs-3-bet only: the VPIP ribbon and thesis spark are flat here, so they are replaced -->
        <section class="rsec" id="labsec" hidden>
          <div class="rsec-h"><button class="rsec-t" type="button" aria-controls="labsec-b"><span class="chev" aria-hidden="true"></span><span class="t-label">Hero equity spread</span><span class="rsec-v t-micro" id="labtag">vs their face-up mix</span></button></div>
          <div class="rsec-b" id="labsec-b">
          <svg class="spark" id="eqhist" viewBox="0 0 224 56" preserveAspectRatio="none" style="height:56px" aria-label="Distribution of hero equity against the face-up 3-bet mix, combo-weighted"></svg>
          <div class="spark-cap t-micro"><span>20%</span><span>equity vs their range</span><span>66%</span></div>
          <div class="t-sm dim" id="labcap" style="margin-top:6px"></div>
          </div>
        </section>
      </div>
      <div class="rail-scroll">
        <!-- V2-PLAN §3 — depth, rake, straddle. Live controls: equity does not move with the
             stacks, so there is nothing here to simulate and no progress bar to draw (§1). -->
        <section class="rsec" id="tablesec">
          <div class="rsec-h"><button class="rsec-t" type="button" aria-controls="tablesec-b"><span class="chev" aria-hidden="true"></span><span class="t-label">Table &amp; stakes</span><span class="rsec-v t-micro" id="tabletag">&mdash;</span></button></div>
          <div class="rsec-b" id="tablesec-b">
          <div class="ctlrow" style="margin-top:0"><label for="depth" class="t-sm">Stack depth</label>
            <output class="ctlval" id="depthval" for="depth">100<span class="pct">bb</span></output></div>
          <div class="slider-wrap"><input id="depth" type="range" min="40" max="250" step="5" value="100" aria-label="Effective stack depth, big blinds"></div>
          <div class="ticks" id="depthticks"></div>
          <div class="ctlrow"><label for="rakepct" class="t-sm">Rake</label>
            <output class="ctlval" id="rakeval" for="rakepct">0<span class="pct">%</span></output></div>
          <div class="slider-wrap"><input id="rakepct" type="range" min="0" max="6" step="0.5" value="0" aria-label="Rake, percent of the pot"></div>
          <div class="ctlrow2">
            <label for="rakecap" class="t-micro" style="color:var(--text-tertiary)">cap</label>
            <input class="vpip-num" id="rakecap" type="number" inputmode="decimal" min="0" max="25" step="0.5" value="3" aria-label="Rake cap, big blinds">
            <span class="t-micro" style="color:var(--text-tertiary)">bb</span>
            <button class="btn btn-sm" id="rakepreset" type="button">5% / 3bb</button>
            <button class="btn btn-sm" id="rakezero" type="button">no rake</button>
          </div>
          <div class="ctlnote" id="rakenote"></div>
          <div class="ctlrow2" style="margin-top:var(--sp-4)">
            <button class="tglchip" id="straddle" type="button" aria-pressed="false"><span class="dot"></span>UTG straddle</button>
            <!-- V2-PLAN §3.2 keeps the 5% preset as the UI default, so the page opens OFF the point
                 where gate I22 asserts v2 == v1. Resolved by presentation, not by moving the
                 default: the identity point is one click, and the chip reads pressed when you are
                 standing on it. -->
            <button class="btn btn-sm" id="v1point" type="button">v1 point</button>
          </div>
          <div class="ctlnote" id="tablenote"></div>
          </div>
        </section>
        <!-- V2-PLAN §4 / §2.3 — the villain profile, and the one control on this page that can
             need a measurement it does not already have. OFF is the default and OFF is not a value
             of v: it is the ABSENCE of the axis, so with this chip up the whole VPIP slider is the
             random-villain model v1 shipped, bit for bit (gate I22's claim, and policy.villainEq
             returns the shipped arrays BY REFERENCE to keep it checkable). -->
        <section class="rsec" id="vpsec" hidden>
          <div class="rsec-h"><button class="rsec-t" type="button" aria-controls="vpsec-b"><span class="chev" aria-hidden="true"></span><span class="t-label">Villain profile</span><span class="rsec-v t-micro" id="vptag">OFF</span></button></div>
          <div class="rsec-b" id="vpsec-b">
          <div class="ctlrow2" style="margin-top:0">
            <button class="tglchip" id="vptoggle" type="button" aria-pressed="false" aria-describedby="vpstat"><span class="dot"></span>Filtered villains</button>
          </div>
          <div class="vprow" id="vpqrow" hidden>
            <label for="vpq" class="t-sm" style="color:var(--text-tertiary)">discipline q</label>
            <input id="vpq" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Villain discipline q — the chance a villain is actually drawn from the filtered range">
            <output class="v" id="vpqval" for="vpq">0.85</output>
            <button class="btn btn-sm" id="vpqreset" type="button" title="back to the one discipline the lattice was measured at">0.85</button>
          </div>
          <div class="vpstat" id="vpstat">&mdash;</div>
          <div id="vpsim" hidden>
            <button class="btn btn-block" id="simbtn" type="button" style="margin-top:var(--sp-3)">Simulate</button>
            <div class="simsegs" id="simsegs" hidden aria-hidden="true"></div>
            <div class="simline" id="simline" hidden></div>
          </div>
          <div class="ctlnote" id="vpnote"></div>
          </div>
        </section>
        <section class="rsec" id="thesissec">
          <div class="rsec-h"><button class="rsec-t" type="button" aria-controls="thesissec-b"><span class="chev" aria-hidden="true"></span><span class="t-label">Thesis</span><span class="rsec-v t-micro" id="thesistag">VPIP 25 &rarr; 90</span></button></div>
          <div class="rsec-b" id="thesissec-b">
          <svg class="spark" id="spark" viewBox="0 0 224 48" preserveAspectRatio="none" aria-label="Width and nut share across VPIP"></svg>
          <div class="spark-cap t-micro"><span style="color:var(--s1)">Width &#9644;</span><span style="color:var(--s3)">Nuttiness &#9480;</span></div>
          </div>
        </section>
        <section class="rsec" id="pinsec">
          <div class="rsec-h"><button class="rsec-t" type="button" aria-controls="pinsec-b"><span class="chev" aria-hidden="true"></span><span class="t-label">Pin &amp; diff</span><span class="rsec-v t-micro" id="pintag">NO PIN</span></button></div>
          <div class="rsec-b" id="pinsec-b">
          <div class="pinbox" id="pinbox"></div>
          </div>
        </section>
        <section class="rsec" id="nodesec" hidden></section>
        <section class="rsec" id="displaysec">
          <div class="rsec-h"><button class="rsec-t" type="button" aria-controls="displaysec-b"><span class="chev" aria-hidden="true"></span><span class="t-label">Display</span><span class="rsec-v t-micro" id="displaytag">&mdash;</span></button></div>
          <div class="rsec-b" id="displaysec-b">
          <div id="displayctl"></div>
          </div>
        </section>
      </div>
      <!-- outside the scroll region: the provenance line is the page's audit trail and must never
           be the thing that gets sliced when the rail overflows -->
      <div class="rail-foot">
        <div class="links">
          <button id="exportcsv">Export CSV</button><button id="copylink">Copy link</button><button id="methodbtn2">Method</button>
        </div>
        <div class="meta" id="modelmeta"></div>
      </div>
    </aside>

    <!-- MATRIX PANE -->
    <section class="pane matrix" id="matrixpane" aria-label="Class matrix">
      <div class="mobilebar" id="mobilebar"></div>
      <div class="legend" id="legend"></div>
      <div class="gainstrip" id="gainstrip" hidden></div>
      <div class="comp">
        <div class="compbar" id="compbar"></div>
        <div class="compnu" id="compnu"></div>
      </div>
      <div class="potodds" id="potodds" hidden></div>
      <div class="subtitle" id="subtitle"></div>
      <!-- V2-PLAN §4 — the provenance strip for the numbers on the grid. Empty and hidden whenever
           the page is showing shipped measurements, which is its default state: a badge that is
           always on says nothing. -->
      <div class="simbar" id="simbar" hidden></div>
      <div class="colhead" id="colhead"></div>
      <div class="gridwrap" id="gridwrap">
        <div id="grid" role="grid" aria-label="Hand class matrix" aria-rowcount="29" aria-colcount="5"></div>
        <canvas id="rain" width="0" height="0" aria-hidden="true"></canvas>
        <div class="gridnote" id="gridnote" hidden></div>
      </div>
      <!-- sibling of the scroll region: inside .gridwrap it overlapped the bottom cells -->
      <div class="rainhud" id="rainhud" hidden></div>
    </section>

    <!-- OTHER VIEWS -->
    <section class="pane" id="fieldpane" hidden aria-label="Field view">
      <div class="legend"><span class="t-label" style="color:var(--text-tertiary)">Field &mdash; &rho; vs &nu;, area &prop; combos, shape = suit topology</span></div>
      <div class="viewpane"><svg id="fieldsvg" viewBox="0 0 900 560" style="width:100%;height:auto"></svg></div>
    </section>
    <section class="pane" id="tablepane" hidden aria-label="Table view">
      <div class="legend"><span class="t-label" style="color:var(--text-tertiary)">Table &mdash; every cell, sortable</span>
        <div class="spacer"></div><button class="btn" id="exportcsv2">Export CSV</button></div>
      <div class="viewpane" style="padding:0"><table class="dtable" id="dtable"></table></div>
    </section>
    <section class="pane" id="methodpane" hidden aria-label="Method">
      <div class="legend"><span class="t-label" style="color:var(--text-tertiary)">Method &mdash; rendered from the shipped model</span></div>
      <div class="viewpane"><div id="methodbody" class="prose"></div></div>
    </section>

    <!-- INSPECTOR -->
    <aside class="inspector" id="inspector" aria-label="Inspector">
      <div class="itabs" id="itabs" role="tablist"></div>
      <div class="ibody" id="ibody"></div>
    </aside>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="vh" id="live" aria-live="polite"></div>

<!-- ============================== INJECTED BLOCKS (rewritten by scripts/build.mjs) -->

var m=s.match(/^([2-9TJQKAtjqka]{4})(ds|ssa|ss|rb|ms3|ms)$/i);
if(m){
var ranks=m[1].toUpperCase().split('').map(function(ch){return RANKS.indexOf(ch);});

if(bad)return{err:'"'+bad[0]+'" — unknown suit "'+bad[1]+'"; use s h d c'};
return{err:'need exactly 4 cards (AsKh9s8d) or 4 ranks + a suit code (AKT9ds)'};

var cs=toks.map(function(t){return RANKS.indexOf(t[0].toUpperCase())*4+SUITS.indexOf(t[1].toLowerCase());});
for(var i=0;i<4;i++)for(var j=i+1;j<4;j++)if(cs[i]===cs[j])return{err:cardName(cs[i])+' appears twice'};

if(!ok)continue;

if(want==='ms3'&&pat==='31')return cards;

function counterfactuals(cards,ev){
var cur=adjScore(cards,ev),out=[];
if(!cur)return{better:[],worse:[]};
var have={};cards.forEach(function(c){have[c]=1;});
for(var i=0;i<4;i++)for(var c=0;c<52;c++){
if(have[c])continue;
var nc=cards.slice();nc[i]=c;nc.sort(function(a,b){return b-a;});
var s=adjScore(nc,ev);
if(!s)continue;
var mech=s.rec.row.key!==cur.rec.row.key?'makes it '+article(s.rec.row.label.toLowerCase())
:s.rec.col.key!==cur.rec.col.key?'makes it '+s.rec.col.label.toLowerCase()
:'same class, better card quality';
out.push({from:cards[i],to:c,delta:s.score-cur.score,cards:nc,mech:mech,key:s.rec.key});
}
out.sort(function(a,b){return b.delta-a.delta;});
function distinct(list){
var seen={},keep=[];
list.forEach(function(o){
var k=o.key+'|'+o.mech;
if(seen[k])return;
seen[k]=1;keep.push(o);
});
return keep;
}
return{
better:distinct(out.filter(function(o){return o.delta>0.5;})),
worse:distinct(out.slice().reverse().filter(function(o){return o.delta<-0.5;}))
};
}

var h=SIMRUN.handle;
SIMRUN=null;SIMLAST=null;SIMTOKEN++;
if(h)h.cancel();
clearSimBar();syncVP();
if(!quiet)announce('simulation cancelled — '+why);
return true;
}
function simCancelOnChange(what){
var g=SIMUI.cancelGuard({running:simRunning()},{changed:true,what:what});
return g.cancel?simCancel(g.reason):false;
}
function clearSimBar(){
var segs=$('#simsegs'),line=$('#simline');
if(segs){segs.hidden=true;segs.innerHTML='';}
if(line){line.hidden=true;line.innerHTML='';}
}
var SIMCB='';
function simFail(where,e){
SIMCB=where+' — '+String((e&&e.message)||e);
try{
if(window.console&&console.error)console.error('[RUNDOWN] the sim '+where+' handler threw',e);
}catch(x){}
try{
var line=$('#simline');
if(!line)return;
line.innerHTML='';
var h=el('b');h.textContent='Display error';
var d=el('div');
d.textContent='The measurement is running and is unaffected; this page failed to draw it ('
+SIMCB+'). The browser console has the detail.';
line.appendChild(h);line.appendChild(d);
line.hidden=false;
}catch(x){}
}
function paintSimBar(p){
var segs=$('#simsegs'),line=$('#simline');
if(!segs||!line)return;
var cp=SIMUI.progressCopy(p);
if(cp.cached||p.phase==='prepare'){segs.hidden=true;segs.innerHTML='';}
else{
var html='';
for(var i=1;i<=2;i++){
var live=(p.stages||1)>=i,f=0;
if(p.stage>i)f=1;
else if(p.stage===i&&p.units)f=p.unit/p.units;
html+='<span class="simseg'+(live?'':' skip')+'"><i style="width:'+(f*100).toFixed(1)+'%"></i></span>';
}
segs.innerHTML=html;segs.hidden=false;
}
var head=el('b');head.textContent=cp.head;
line.innerHTML='';line.appendChild(head);
var rest=el('div');rest.innerHTML=cp.line;line.appendChild(rest);
line.hidden=false;
}
function simCacheHint(){
if(!simAvailable()||!window.SIM.cache)return'';
var st=window.SIM.cache.status();
return st.backend==='memory'
?'Results are kept for this session only — this browser refused persistent storage here.'
:'A repeat of these exact settings may come back instantly from this browser’s own storage. '
+'That is a pleasant surprise, not a promise: nothing here is guaranteed to still be there later.';
}
function cacheOffer(){
if(!simAvailable()||!window.SIM.cache)return'none';
var hit=null;
try{hit=window.SIM.cache.peek({v:S.v,q:S.q,trials:simTrials()});}catch(e){return'none';}
if(!hit)return'none';
return'full';
}
function vpBracketText(){
if(!POL.latticeBracket)return'';
var br=POL.latticeBracket(VPTS,S.v);
if(br.lo<0||br.exact)return'';
if(br.lo===br.hi)return'clamped to the '+VPTS[br.lo]+'% row (the end of the measured range)';
return'interpolated '+Math.round((1-br.f)*100)+'/'+Math.round(br.f*100)+' between the measured '
+VPTS[br.lo]+'% and '+VPTS[br.hi]+'% rows';
}
function eqProvenanceText(){
var base=MODEL.meta.trials.cell.toLocaleString()+' trials/cell · SE ±'+MODEL.meta.se.cell+' pt';
if(!HAS_VP||!S.vp)return base;

if(t.badge==='measured'){
return'simulated ±'+r.se.toFixed(2)+' pt — '+SIMUI.group(r.trialsPerCell)+
' trials/cell measured in this browser vs a field playing the top '+S.v+'% at q '+S.q.toFixed(2)+
(r.source==='cache'?' (from cache)':'')+(r.degraded?' (main-thread fallback)':'');

+'&times; Rainbow is <b>'+d('BROADWAY_RUN|RB',1)+'</b> equity points heads-up &mdash; while low '
+'rundowns <i>gain</i> the most: Low rundown &times; Single-suited nut is <b>'+d('RUN0_LOW|SSA',1)

+'broadway/AA-heavy range. Junk barely moves (Trash &times; Rainbow '+d('TRASH|RB',1)+' / '

function startSim(mult){
if(!simAvailable())return;
simCancel('replaced by a new run',true);
var mine=++SIMTOKEN;
var live=function(){return SIMRUN&&SIMRUN.token===mine;};
var rr=simRerun();
if(mult>1&&!rr.can){syncVP();return;}
var trials=mult>1?rr.next:simTrials();
SIMERR='';SIMCB='';
SIMRUN={token:mine,handle:null};
var h=window.SIM.run({
v:S.v,q:S.q,trials:trials,
onProgress:function(p){if(!live())return;try{SIMLAST=p;paintSimBar(p);}catch(e){simFail('progress',e);}},
onDone:function(res){if(!live())return;SIMRUN=null;SIMLAST=null;try{onSimDone(res);}catch(e){simFail('completion',e);}},
onError:function(e){
if(!live())return;
SIMRUN=null;SIMLAST=null;SIMERR=String(e&&e.message||e);
try{clearSimBar();syncVP();announce('simulation failed — '+SIMERR);}catch(x){simFail('error',x);}
},
onCancel:function(){if(!live())return;SIMRUN=null;SIMLAST=null;try{clearSimBar();syncVP();}catch(e){simFail('cancel',e);}}
});
if(SIMRUN&&SIMRUN.token===mine)SIMRUN.handle=h;
syncVP();
announce('simulating '+SIMUI.group(trials)+' trials per cell against a field playing the top '+S.v+
'% of hands.');
}

rec=CELLS[i];if(!rec.live)continue;
t=lastEv.tier[i];

var c=el('span','chev',t<prev[i]?'▲':'▼');

function slopFind(e){
var best=null,bestA=1e9;
for(var i=0;i<NCELL;i++){
if(!CELLS[i].live)continue;
var r=cellNodes[i].getBoundingClientRect();
if(e.clientX>=r.left-4&&e.clientX<=r.right+4&&e.clientY>=r.top-4&&e.clientY<=r.bottom+4){
var a=r.width*r.height;
if(a<bestA){bestA=a;best=cellNodes[i];}
}
}
return best;
}

function gridMove(i,nr,nc){
var r=(i/NC)|0,c=i%NC;
nr=clamp(nr,0,NR-1);nc=clamp(nc,0,NC-1);
var guard=0;
while(!CELLS[nr*NC+nc].live&&guard++<40){
if(nc!==c){nc+=(nc>c?1:-1);if(nc<0||nc>NC-1){nc=c;break;}}
else{nr+=(nr>r?1:-1);if(nr<0||nr>NR-1){nr=r;break;}}
}
var t=CELLS[nr*NC+nc];
if(!t.live)return false;
if(cellNodes[i])cellNodes[i].tabIndex=-1;
cellNodes[t.i].tabIndex=0;cellNodes[t.i].focus();
select(t.key);
announce(t.row.label+' by '+t.col.label);
return true;
}
function onGridKey(e){
var cur=document.activeElement;
if(!cur||!cur.classList.contains('cell'))return;
var i=+cur.dataset.i,r=(i/NC)|0,c=i%NC,moved=false;
function go(nr,nc){moved=gridMove(i,nr,nc)||moved;}
switch(e.key){
case'ArrowRight':go(r,c+1);break;
case'ArrowLeft':go(r,c-1);break;
case'ArrowDown':go(r+1,c);break;
case'ArrowUp':go(r-1,c);break;
case'Home':go(r,0);break;
case'End':go(r,NC-1);break;
case'PageDown':go(bandJump(r,1),c);break;
case'PageUp':go(bandJump(r,-1),c);break;
case'Enter':case' ':select(CELLS[i].key);openDrawer();moved=true;break;
default:return;
}
if(moved||e.key==='Enter')e.preventDefault();
}
function bandJump(r,dir){
for(var i=0;i<BANDS.length;i++){
var b=BANDS[i];
if(r+1>=b.rows[0]&&r+1<=b.rows[1]){
var t=BANDS[clamp(i+dir,0,BANDS.length-1)];
return t.rows[0]-1;
}
}
return r;
}

function extrapReach(){
var fires=0,total=0,max=0,at='';
var raw0=(POL&&POL.nEff)
?function(st){return POL.nEff(st).raw;}
:function(st){return nEffRaw(st.v,st.pos,st.node,st.limpers);};
var strs=HAS_ENV?[false,true]:[false];

var node=NODES[ni].key,lp=legalPos(node);

var Ls=node==='limps'?[1,2,3,4]:[2];
for(var si=0;si<strs.length;si++)for(var li=0;li<Ls.length;li++){
for(var v=VMIN;v<=VMAX;v++){
var raw=raw0({pos:pos,node:node,v:v/100,limpers:Ls[li],straddle:strs[si]});

at=NODEBY[node].label+' / '+pos+' / VPIP '+v+
(node==='limps'?' / '+Ls[li]+' limpers':'')+(strs[si]?' / straddled':'');
